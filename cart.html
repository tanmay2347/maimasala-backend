<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - MaiMasala</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-container { max-width: 900px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .cart-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 15px 0; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
        .cart-details { flex: 1; margin-left: 15px; }
        .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .qty-btn { background: #eee; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .remove-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .cart-summary { margin-top: 20px; text-align: right; border-top: 2px solid #ddd; padding-top: 15px; }
        .checkout-btn { background: #2e7d32; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"> MaiMasala</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="orders.html">My Orders</a>
        </div>
    </header>

    <div class="cart-container">
        <h2>🛒 Your Shopping Cart</h2>
        <div id="cartItemsList">
            <p>Loading cart...</p>
        </div>

        <div class="cart-summary" id="cartSummary" style="display: none;">
            <h3>Total Amount: ₹<span id="grandTotal">0</span></h3>
            <a href="checkout.html" class="checkout-btn">Proceed to Checkout ➡️</a>
        </div>
    </div>

   <script>
    function loadCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const list = document.getElementById("cartItemsList");
        const summary = document.getElementById("cartSummary");
        const grandTotalEl = document.getElementById("grandTotal");

        if (!cart.length) {
            list.innerHTML = "<p>Your cart is empty! <a href='index.html'>Browse Masalas</a></p>";
            summary.style.display = "none";
            return;
        }

        summary.style.display = "block";
        list.innerHTML = "";
        let grandTotal = 0;

        cart.forEach((item, index) => {
            const itemPrice = Number(item.price) || 0;
            const itemQty = Number(item.qty) || 1;
            const itemTotal = itemPrice * itemQty;
            
            grandTotal += itemTotal;

            list.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" onerror="this.src='https://via.placeholder.com/70'">
                    <div class="cart-details">
                        <h4>${item.name}</h4>
                        <p>Price per item: ₹${itemPrice}</p>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                            <span><strong>${itemQty}</strong></span>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <p>Subtotal: <strong>₹${itemTotal}</strong></p>
                    <button class="remove-btn" onclick="removeItem(${index})">🗑️ Remove</button>
                </div>
            `;
        });

        grandTotalEl.innerText = grandTotal;
    }

    function changeQty(index, delta) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (cart[index]) {
            let currentQty = Number(cart[index].qty) || 1;
            currentQty += delta;

            if (currentQty <= 0) {
                cart.splice(index, 1);
            } else {
                cart[index].qty = currentQty;
            }
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    }

    loadCart();
</script>
</body>
</html>
